[request_definition]
# grp: group id
# resourcePath: hierarchical resource path (e.g., "//openchoreo.orgs/acme/project/p1")
# act: action string ("deployment.create")
# ctx: context JSON (env etc)
r = grp, resourcePath, act, ctx

[policy_definition]
# grp: group id that gets the role
# resourcePath: resource prefix for hierarchical matching
# role: role name
# eft: allow / deny
# cond: condition JSON
p = grp, resourcePath, role, eft, cond

[role_definition]
# role to action mapping
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = r.grp == p.grp && prefixMatch(r.resourcePath, p.resourcePath) && g(r.act, p.role) && ctxAllowed(r.ctx, p.cond)