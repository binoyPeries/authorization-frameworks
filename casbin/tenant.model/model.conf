[request_definition]
# sub: user or group id
# act: action string in format "resource:verb" (e.g., "component:view", "component:*", "*")
# dom: scope path of the target resource (see path scheme below)
# ten: tenant/organization identifier in format "org/{orgName}" (e.g., "org/acme", "org/techcorp")
# ctx: optional context payload (for ABAC checks you add later)
r = sub, act, dom, ten, ctx

[policy_definition]
# sub: role name (e.g., role:developer)
# act: action string in format "resource:verb" or wildcards (e.g., "component:view", "component:*", "*")
# ten: tenant/organization in format "org/{orgName}" - permissions are scoped to this organization
p = sub, act, ten

[role_definition]
# RBAC with domains - tenant is encoded in role name
# subject, role_with_tenant, domain
# Role format: role:RoleName@org/tenantName (e.g., role:OrgAdmin@org/acme)
g = _, _, _

[policy_effect]
e = some(where (p_eft == allow))

[matchers]
# Match actions using globMatch for wildcard support (globMatch doesn't treat : as separator)
# Supports: "component:view", "component:*", "*"
# Supports tenant wildcard: "org/*" matches any organization
# Check that:
# 1. Policy tenant matches requested tenant (or wildcard)
# 2. Policy action matches requested action (or wildcard using globMatch)
# 3. User has the role (with tenant encoded) in the requested domain
#    Role format: role:RoleName@org/tenantName
# keyMatch2(r.ten, p.ten) is not needed if we are not using wildcards in tenant names
m = (p.ten == r.ten) && (p.act == "*" || globMatch(r.act, p.act)) && g(r.sub, p.sub + "@" + r.ten, r.dom)
